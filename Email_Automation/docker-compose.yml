version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: email_automation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=email_automation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d email_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: email_automation_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/email_automation
    command: >
      sh -c "alembic upgrade head && python main.py"

volumes:
  postgres_data: