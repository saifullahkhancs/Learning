<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    
<button>
    Button Clicked
</button>

<script>

    class React {
        constructor() {
            this.library = 'React';
            this.server = "http://localhost:3000";

            // requirment    
            //1:-  page load create an object
            //2:- on click we get the button reference 
            //3:- we got any message when button is clicked


            document.querySelector('button')
            .addEventListener('click', this.hadleClick.bind(this));

            // if we not use the bind method then we get the error because this keyword is not refer to the 
            // class object but it refer to the button element and button element does not have library property 
            // so we get undefined
        }

        hadleClick() {
            console.log('Button Clicked');
            console.log(this.library);
        }
    }

    const app = new React();

</script>

</body>
</html>
