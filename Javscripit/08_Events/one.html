 //  ******* event propagation *******
 // event propagation is the process by which an event travels through the DOM tree. There are three phases of event propagation: capturing phase, target phase, and bubbling phase.
 // capturing phase :- in this phase, the event is captured by the ancestors of the target element, starting from the root element and going down to the target element. The event is executed in this phase if the useCapture parameter of the addEventListener method is set to true.
 // target phase :- in this phase, the event is executed on the target element
 // .bubbling phase :- in this phase, the event is propagated back up the DOM tree, starting from the target element and going up to the root element. The event is executed in this phase if the useCapture parameter of the addEventListener method is set to false.

document.querySelector('#images').addEventListener('click', function(event) {
    console.log('you clicked on the images list');
    // const item = event.target.parentNode
    // sometime accidental  click on the list remove all the list items so to avoid that we can check if the target element is an image or not 
    if(event.target.tagName === 'IMG') {
        let item = event.target.parentNode;

        item.remove();
    }
